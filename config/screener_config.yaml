filters:
  roe_min:
    column: return_on_equity_pct
    operator: ">"
    description: "Return on Equity minimum"

  de_max:
    column: debt_to_equity
    operator: "<"
    description: "Debt to Equity maximum"

  fcf_min:
    column: free_cash_flow_cr
    operator: ">"
    description: "Free Cash Flow minimum"

  revenue_cagr_5yr_min:
    column: revenue_cagr_5yr
    operator: ">"
    description: "Revenue CAGR 5 year minimum"

  pat_cagr_5yr_min:
    column: pat_cagr_5yr
    operator: ">"
    description: "PAT CAGR 5 year minimum"

  opm_min:
    column: operating_profit_margin_pct
    operator: ">"
    description: "Operating Profit Margin minimum"

  pe_max:
    column: pe_ratio
    operator: "<"
    description: "Price Earnings maximum"

  pb_max:
    column: pb_ratio
    operator: "<"
    description: "Price to Book maximum"

  dividend_yield_min:
    column: dividend_yield_pct
    operator: ">"
    description: "Dividend Yield minimum"

  icr_min:
    column: interest_coverage
    operator: ">"
    description: "Interest Coverage minimum"

  market_cap_min:
    column: market_cap_crore
    operator: ">"
    description: "Market Capitalisation minimum"

  net_profit_min:
    column: net_profit_cr
    operator: ">"
    description: "Net Profit minimum"

  eps_cagr_min:
    column: eps_cagr_5yr
    operator: ">"
    description: "EPS CAGR 5 year minimum"

  asset_turnover_min:
    column: asset_turnover
    operator: ">"
    description: "Asset Turnover minimum"

  sales_min:
    column: sales_cr
    operator: ">"
    description: "Sales minimum"

  dividend_payout_max:
    column: dividend_payout_ratio_pct
    operator: "<"
    description: "Dividend payout ratio maximum"

  revenue_cagr_3yr_min:
    column: revenue_cagr_3yr
    operator: ">"
    description: "Revenue CAGR 3 year minimum"

  de_declining:
    column: debt_to_equity_declining
    operator: "=="
    description: "Debt to Equity declining year-over-year"


presets:
  quality_compounder:
    roe_min: 15
    de_max: 1.0
    fcf_min: 0
    revenue_cagr_5yr_min: 10

  value_pick:
    pe_max: 20
    pb_max: 3.0
    de_max: 2.0
    dividend_yield_min: 1

  growth_accelerator:
    pat_cagr_5yr_min: 20
    revenue_cagr_5yr_min: 15
    de_max: 2.0

  dividend_champion:
    dividend_yield_min: 2
    dividend_payout_max: 80
    fcf_min: 0

  debt_free_blue_chip:
    de_max: 0
    roe_min: 12
    sales_min: 5000

  turnaround_watch:
    revenue_cagr_3yr_min: 10
    fcf_min: 0
    de_declining: true